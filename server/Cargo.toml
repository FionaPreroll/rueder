[package]
name = "rueder"
version = "0.1.0"
edition = "2024"
# Not a crate for crates.io: the server is built from this repository.
publish = false

[dependencies]
ammonia = "4.2.4"
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = "0.8.9"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
dotenvy = "0.15.7"
# Decodes a feed in the encoding it names, see `feeds::utf_8`.
encoding_rs = "0.8.44"
feed-rs = "3.0.0"
futures-util = "0.3.34"
getrandom = "0.4.3"
hmac = "0.13.0"
# The parser ammonia uses, and a document tree for it, for rueder's own rules.
html5ever = "0.40.1"
# Only the formats the image proxy lets through; no SVG, nothing that needs C code.
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
markup5ever_rcdom = "=0.40.1"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
quick-xml = { version = "0.42", features = ["encoding"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "gzip", "brotli", "deflate", "zstd"] }
rpassword = "7.5.5"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11"
sha2 = "0.11"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "time", "uuid", "json"] }
time = { version = "0.3.55", features = ["formatting", "macros", "parsing", "serde"] }
tokio = { version = "1.53.2", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# Writes the API's types in TypeScript for the frontend, see src/typescript.rs.
ts-rs = { version = "12.0.1", default-features = false, features = ["serde-compat", "no-serde-warnings"] }
url = "2.5.8"
uuid = { version = "1", features = ["serde", "v4"] }
# Passkeys: checks what browsers send in WebAuthn, see src/passkeys.rs. Pure
# Rust on RustCrypto since 0.6; without attestation, which rueder does not ask
# for, and with the login that needs no name (`conditional-ui`).
webauthn-rs = { version = "0.6.2", default-features = false, features = ["conditional-ui"] }
webpki-roots = "1.0.11"
zstd = "0.14.3"

[dev-dependencies]
flate2 = "1.1.11"
http-body-util = "0.1.5"
# Signs as a passkey's device does, for tests/passkeys.rs.
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa"] }
proptest = "1.12.0"
tower = { version = "0.5.3", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

# The documentation (cargo doc --document-private-items, on GitHub Pages) shows
# the private items too, so a link to one leads somewhere.
[lints.rustdoc]
private_intra_doc_links = "allow"

# Hashing a password is slow on purpose, and without optimization many times
# slower: too slow for tests that log in.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
