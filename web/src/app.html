<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="referrer" content="no-referrer" />
		<title>rueder</title>
		<!-- The mark of the top bar, in the page itself so that no build has to ship a file for it. -->
		<link
			rel="icon"
			href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23c8402e'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'%3E%3Cpath d='M7 11a6 6 0 0 1 6 6'/%3E%3Cpath d='M7 6a11 11 0 0 1 11 11'/%3E%3C/g%3E%3Ccircle cx='7.6' cy='16.6' r='1.6' fill='%23fff'/%3E%3C/svg%3E"
		/>
		<!-- To install it as an app: name, icons and colors (static/manifest.webmanifest). -->
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#1c1f25" media="(prefers-color-scheme: dark)" />
		<script>
			// The look before the first paint, so that a dark page never flashes light
			// (see settings.svelte.ts, which keeps these attributes up to date afterwards).
			try {
				var look = JSON.parse(localStorage.getItem('rueder.settings') || '{}');
			} catch (e) {
				look = {};
			}
			var root = document.documentElement;
			root.dataset.theme =
				look.theme === 'dark' || look.theme === 'light'
					? look.theme
					: matchMedia('(prefers-color-scheme: dark)').matches
						? 'dark'
						: 'light';
			if (look.accent) root.dataset.accent = look.accent;
			if (look.density) root.dataset.density = look.density;
			if (look.textSize) root.dataset.textSize = look.textSize;
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div class="contents">%sveltekit.body%</div>
	</body>
</html>
