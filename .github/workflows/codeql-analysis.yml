name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "43 6 * * 0"

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # The server (rust), the web page and the app's start page
        # (javascript-typescript) and the workflows themselves (actions) are
        # analysed from their source. The app's native part (java-kotlin) is
        # built, so that CodeQL knows the classes it calls (Capacitor, AndroidX,
        # Android) and the ones Gradle writes (BuildConfig, R): from the source
        # alone it had to guess them, and saw both builds' Updates.java as one
        # class twice.
        include:
          - language: actions
            build-mode: none
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: rust
            build-mode: none
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # What building the app needs, as the job app in ci.yml has it: Capacitor
      # from npm, the start page in the Android project, and Java. No cache:
      # this job would make a key of its own for one build a week.
      - if: matrix.language == 'java-kotlin'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - if: matrix.language == 'java-kotlin'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: app/package.json
      - if: matrix.language == 'java-kotlin'
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm run sync
      # gradle-wrapper.jar runs in the build below: one that Gradle published.
      - if: matrix.language == 'java-kotlin'
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      # The build that is released, with the update check that downloads and
      # installs APKs (src/github/). The play build's Updates.java does
      # nothing and stays out, so no class is there twice.
      - if: matrix.language == 'java-kotlin'
        working-directory: app/android
        run: ./gradlew --no-daemon compileGithubReleaseJavaWithJavac
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
