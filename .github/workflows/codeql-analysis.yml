name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "43 6 * * 0"

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # The new server (rust), the frontends (javascript-typescript), the
        # workflows themselves (actions) and the old scripts in backend/utils
        # (python). Go left with backend/go.mod: CodeQL can only analyse Go
        # by building it.
        language: [actions, javascript-typescript, python, rust]
    steps:
      - uses: actions/checkout@v4
      # Every language here is analysed from its source, without a build.
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
