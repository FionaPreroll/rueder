name: Pages

# rueder's site on GitHub Pages (pages/README.md): an overview, the demo, the
# self-hosting and app pages, the documentation of the server's Rust and the
# page's TypeScript, and the pictures the README shows, at
# https://<owner>.github.io/<repository>/. Every pull request builds it, so a
# doc comment rustdoc cannot read, a picture that cannot be taken or a link
# that leads nowhere turns the check red; a push to main also publishes it.
# The pictures are taken anew each time and never committed.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# What every job may do with the repository's token unless it says more: read.
# Only deploy writes, and only to Pages. No checkout keeps the token in
# .git/config (persist-credentials), as in ci.yml.
permissions:
  contents: read

# A newer push to a pull request stops the older run; on main every run
# finishes, and deploy-pages publishes them one after the other.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The server's documentation, private items included. A doc comment with a
  # broken link or HTML that rustdoc cannot read fails here (-D warnings).
  rust:
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # branch stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: server
      # The commit and the day at the foot of every page; pages/footer.js needs no packages.
      - run: node pages/footer.js --rustdoc > "$RUNNER_TEMP/footer.html"
      - run: cargo doc --no-deps --lib --document-private-items
        working-directory: server
        env:
          RUSTDOCFLAGS: -D warnings --html-after-content ${{ runner.temp }}/footer.html
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pages-rust
          path: server/target/doc
          if-no-files-found: error
          retention-days: 1

  # The demo (the page as one file with made-up data), the pictures of it the
  # README shows, and the documentation of the page's TypeScript.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # The pnpm version pinned in package.json (packageManager).
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:single
      # The README's pictures, of the demo just built (web/showcase/).
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run showcase
      - run: RUEDER_DOCS_FOOTER="$(node ../pages/footer.js)" pnpm run build:docs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pages-demo
          path: web/build
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pages-frontend
          path: web/build-docs
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pages-screenshots
          path: web/showcase/out
          if-no-files-found: error
          retention-days: 1
          # PNG files are packed already.
          compression-level: 0
      # What the browser saw when a picture could not be taken.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: showcase-report
          path: |
            web/playwright-report
            web/test-results

  # The Android app's Java code. Its build.gradle stays as it is: the task
  # comes from pages/javadoc.gradle, so that the tools of the documentation
  # are no change to the app, which CI would release anew (ci.yml, app-changed).
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # The pnpm version pinned in package.json (packageManager).
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: app/package.json
      - run: pnpm install --frozen-lockfile
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: pnpm run sync
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          # Its own key, not the one of the build in ci.yml, which needs more
          # than the Javadoc (see there).
          cache-dependency-path: |
            app/android/**/*.gradle*
            app/android/**/gradle-wrapper.properties
            app/pnpm-lock.yaml
            pages/javadoc.gradle
      - run: RUEDER_DOCS_FOOTER="$(node ../../pages/footer.js)" ./gradlew --no-daemon --init-script ../../pages/javadoc.gradle javadoc
        working-directory: app/android
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pages-app
          path: app/android/app/build/docs/javadoc
          if-no-files-found: error
          retention-days: 1

  # The parts where pages/build.js looks for them, the overview and the pages
  # made of READMEs, and the check that every link leads somewhere.
  site:
    needs: [rust, web, app]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pages
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # The pnpm version pinned in package.json (packageManager).
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: pages/package.json
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm test
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pages-rust
          path: server/target/doc
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pages-demo
          path: web/build
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pages-frontend
          path: web/build-docs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pages-app
          path: app/android/app/build/docs/javadoc
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pages-screenshots
          path: web/showcase/out
      - run: node build.js --out ../_site
      # Also on pull requests: the run's artifact github-pages is the site as
      # it would be published, to look at before merging.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  # Only from main. The repository's Settings, Pages, has to name "GitHub
  # Actions" as the source once; the environment github-pages that GitHub then
  # makes lets only the default branch publish.
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: site
    runs-on: ubuntu-latest
    permissions:
      pages: write # to publish the site
      id-token: write # for the token deploy-pages proves this run with
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
