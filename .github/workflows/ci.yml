name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The new server in server/ and the new frontend in web/. The workflows of the Go
  # backend and the old frontend stay until the switch.
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Builds use the committed .sqlx cache; tests need a server to create per-test databases.
      SQLX_OFFLINE: "true"
      DATABASE_URL: postgres://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # Runs the tests (like cargo test) with coverage instrumentation, for Codecov.
      - run: cargo llvm-cov --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: server/lcov.info
          flags: server

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The pnpm version pinned in package.json (packageManager).
      - run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run check
      # Unit and component tests with coverage, for Codecov.
      - run: pnpm run test:coverage
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: web/coverage/lcov.info
          flags: web
      - run: pnpm run build
      # The interface as one HTML file that runs without a server, to try a change
      # by opening the file: download it from the run's artifacts.
      - run: pnpm run build:single
      - uses: actions/upload-artifact@v4
        with:
          name: rueder-ui-draft
          path: web/build/index.html
          if-no-files-found: error
