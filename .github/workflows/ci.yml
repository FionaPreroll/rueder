name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Mondays at 05:17 UTC: a new advisory about a dependency, an action or
  # the published image shows up even in a week without a change. Only the
  # jobs dependencies, workflows and image-scan run then.
  schedule:
    - cron: "17 5 * * 1"

# What every job may do with the repository's token unless it says more: read.
# Only app-release and publish write, each to what it releases. No checkout
# keeps the token in .git/config (persist-credentials), so the code a job
# runs after it cannot read it from there.
permissions:
  contents: read

jobs:
  # The server in server/, the web page in web/ and the Android app in app/.
  server:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Builds use the committed .sqlx cache; tests need a server to create per-test databases.
      SQLX_OFFLINE: "true"
      DATABASE_URL: postgres://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Pinned to a commit, the action no longer takes the toolchain from its
      # branch name. Rust itself stays the newest stable; rustup checks what it
      # downloads against rust-lang.org's signed manifests.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # branch stable
        with:
          toolchain: stable
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: server
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # The newest version in the action's own list at the pinned commit, its
      # download checked against the checksum there; Dependabot raises it with
      # the action (see docs/implementation.md).
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-llvm-cov
      # Runs the tests (like cargo test) with coverage instrumentation, for Codecov.
      - run: cargo llvm-cov --lcov --output-path lcov.info
      - uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: server/lcov.info
          flags: server

  # What the server is built from: no dependency with a known vulnerability,
  # only licenses, sources and crates that server/deny.toml allows.
  dependencies:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Versions and checksums from the action's list, as above.
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-audit,cargo-deny
      # Reads Cargo.lock; its exceptions are in server/.cargo/audit.toml.
      - run: cargo audit
      # Reads what is really built: advisories again, licenses, banned crates, sources.
      - run: cargo deny check

  # What a pull request adds to everything else rueder is built from: npm in
  # web/ and app/, the actions, and Cargo again. A new or raised dependency
  # with a known vulnerability fails it, whether it ends up in the build or
  # only runs while building. Gradle shows up only as far as GitHub can read
  # it from the build files.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          fail-on-scopes: runtime, development, unknown
          # deepmerge 4.3.1, which @sveltejs/vite-plugin-svelte needs and for
          # which there is no fix; see docs/implementation.md.
          allow-ghsas: GHSA-gcqx-w48m-w2h4

  # The workflows themselves: zizmor looks for what makes a workflow unsafe,
  # such as text from outside in a script, a token that may do more than it
  # needs or stays behind for later steps, an action that is not pinned or
  # has a known vulnerability. It also runs on schedule, for the advisories.
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Version and checksum from the action's list, as in the job server.
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: zizmor
      # The token lets zizmor ask GitHub about the pinned actions (read only).
      - run: zizmor --format github .github
        env:
          GH_TOKEN: ${{ github.token }}

  web:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # The pnpm version pinned in package.json (packageManager).
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run check
      # Unit and component tests with coverage, for Codecov.
      - run: pnpm run test:coverage
      - uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: web/coverage/lcov.info
          flags: web
      - run: pnpm run build
      # The interface as one HTML file that runs without a server, to try a change
      # by opening the file: download it from the run's artifacts.
      - run: pnpm run build:single
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rueder-ui-draft
          path: web/build/index.html
          if-no-files-found: error

  # The built page in a real browser against the real server: logging in,
  # subscribing, reading, folders, filter rules and live updates (web/e2e).
  e2e:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SQLX_OFFLINE: "true"
      # Where the run makes its own database, rueder_e2e.
      DATABASE_URL: postgres://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # branch stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: server
      - run: cargo build
        working-directory: server
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm run build
        working-directory: web
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      - run: pnpm run e2e
        working-directory: web
      # What the browser saw when a test failed: screenshots and traces.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: e2e-report
          path: |
            web/playwright-report
            web/test-results

  # The Android app (app/): the start page's tests, then both builds. "github"
  # is the one released below, which looks for new versions of itself if the
  # reader agrees; "play" is for the Play Store, without the update check. The
  # github build comes as a debug APK, which installs but cannot update an
  # installed release, and as an unsigned release, which app-release signs.
  app:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: app/package.json
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm test
      # gradle-wrapper.jar runs first in every build, the one released too: it
      # has to be one that Gradle published.
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # The start page into the Android project.
      - run: pnpm run sync
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      # Never with the signing key: this job runs the build scripts of every
      # pull request. The release build stays unsigned; app-release signs it.
      - name: Build
        working-directory: app/android
        env:
          VERSION_CODE: ${{ github.run_number }}
        # The version, the build and the commit, as Android shows the app's version.
        run: |
          export VERSION_NAME="$(node -p "require('../package.json').version")-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          ./gradlew --no-daemon testGithubDebugUnitTest testPlayDebugUnitTest assembleGithubDebug assembleGithubRelease assemblePlayRelease
          mkdir -p ../out
          mv app/build/outputs/apk/github/debug/app-github-debug.apk ../out/rueder-debug.apk
          mv app/build/outputs/apk/github/release/app-github-release-unsigned.apk ../out/rueder-unsigned.apk
          mv app/build/outputs/apk/play/release/app-play-release-unsigned.apk ../out/rueder-play-unsigned.apk
      # TEMPORARY: writes the first gradle/verification-metadata.xml for the
      # pull request that adds it; removed again before it is merged.
      - name: Write verification metadata
        working-directory: app/android
        run: |
          ./gradlew --no-daemon --write-verification-metadata sha256 testGithubDebugUnitTest testPlayDebugUnitTest assembleGithubDebug assembleGithubRelease assemblePlayRelease
          wc -c gradle/verification-metadata.xml
          echo "BEGIN-METADATA"
          gzip -9c gradle/verification-metadata.xml | base64 -w 0 | fold -w 3000
          echo
          echo "END-METADATA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rueder-android
          path: app/out/
          if-no-files-found: error

  # Whether what goes into the app changed since the build released as
  # android-latest, whose commit the tag points at. Only then does app-release
  # make a new release, so installed apps are offered an update only when there
  # is something new in it: a change elsewhere in the repository, or only to the
  # app's README or tests, leaves the release as it is. Without the tag, or if
  # git cannot tell, it counts as changed.
  app-changed:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: diff
        run: |
          changed=true
          # Only the released commit is fetched; comparing two trees needs no history.
          if git fetch --no-tags --depth=1 origin "+refs/tags/android-latest:refs/tags/android-latest"; then
            if git diff --quiet android-latest HEAD -- app \
              ':(exclude)app/README.md' ':(exclude)app/test' ':(exclude)app/android/app/src/test' \
              ':(exclude)app/.prettierignore' ':(exclude)app/prettier.config.js'; then
              changed=false
            fi
          fi
          echo "Released from $(git rev-parse --short android-latest 2>/dev/null || echo nothing), app changed: $changed"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  # Every push to main that passed the checks and changed the app (see
  # app-changed) replaces the release "rueder for Android" (tag android-latest):
  # the APK, signed here, and its version.json, which the app reads to find a
  # newer build. Only this job sees the signing key, and it runs none of the
  # repository's build scripts. The key's secrets belong in the environment
  # android-release, which can ask for an approval before the job starts
  # (app/README.md says how to set it up); a push that leaves the app alone
  # never gets that far.
  app-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.app-changed.outputs.changed == 'true'
    needs: [web, e2e, app, app-changed]
    runs-on: ubuntu-latest
    environment: android-release
    permissions:
      contents: write
      # For the attestation of the APK.
      id-token: write
      attestations: write
    concurrency:
      group: android-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rueder-android
          path: out
      # With the tools of the Android SDK on the runner, not with Gradle.
      - name: Sign
        id: sign
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "No signing key in the secrets: nothing to release."
            exit 0
          fi
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/rueder.keystore"
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          "$tools/zipalign" -p -f 4 out/rueder-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/rueder.keystore" --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD --out out/rueder.apk "$RUNNER_TEMP/aligned.apk"
          rm -f "$RUNNER_TEMP/rueder.keystore"
          "$tools/apksigner" verify out/rueder.apk
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Release
        id: release
        if: steps.sign.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: android-latest
        run: |
          # Only for the commit main points at now, so an older run that ends
          # last does not replace a newer build.
          head=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$head" != "$GITHUB_SHA" ]; then echo "main moved on"; exit 0; fi
          printf '{"build":%s,"commit":"%s","size":%s}\n' "$GITHUB_RUN_NUMBER" "$GITHUB_SHA" "$(stat -c %s out/rueder.apk)" > out/version.json
          cat > notes.md <<NOTES
          The newest build of rueder for Android, from commit ${GITHUB_SHA::7} (build ${GITHUB_RUN_NUMBER}). This release is replaced whenever the app changes on \`main\`.

          **Installing:** download \`rueder.apk\` below and open it on the phone; Android asks once to allow installing apps from that source. At the first start the app asks for the address of your rueder. A newer APK installs over an older one, and the app can look for one itself if you agree (on its start page, or with a long press on its icon: Server and updates).
          NOTES
          # The tag through the API, with the token of this step alone.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            gh api --silent -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" -f sha="$GITHUB_SHA" -F force=true
          else
            gh api --silent -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/rueder.apk out/version.json --clobber
            gh release edit "$TAG" --title "rueder for Android" --notes-file notes.md --latest=false
          else
            gh release create "$TAG" out/rueder.apk out/version.json --title "rueder for Android" --notes-file notes.md --latest=false
          fi
          echo "released=true" >> "$GITHUB_OUTPUT"
      # A signed statement that this APK was built by this workflow from this
      # commit: gh attestation verify rueder.apk --repo FionaPreroll/rueder
      - if: steps.release.outputs.released == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: out/rueder.apk

  # The container image as deploy/compose.yaml runs it: built, started next to
  # PostgreSQL and asked whether it works. Both architectures are built on a
  # runner of their own, each for the machine it runs on: building arm64 under
  # emulation would take far longer than all other jobs together. On main the
  # very image that was tested goes on to the job publish, as an OCI archive;
  # nothing is built again for publishing.
  image:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: amd64
            on: ubuntu-latest
          - platform: arm64
            on: ubuntu-24.04-arm
    runs-on: ${{ matrix.on }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      # The layers go to the cache of GitHub Actions, one scope per
      # architecture, so that an unchanged stage is not built again.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          # One build, written out twice: into Docker for the smoke test below
          # and as an OCI archive, which publish pushes byte for byte.
          outputs: |
            type=docker,name=rueder:ci
            type=oci,dest=${{ runner.temp }}/rueder-${{ matrix.platform }}.tar
          # Where the image comes from is attested by publish (actions/attest),
          # signed; the archive holds the image alone.
          provenance: false
          # The commit checked out above: for a pull request that is the merge
          # of the branch into main (github.sha), not the branch's head, and the
          # image is built from it. The branch is still the pull request's.
          build-args: |
            RUEDER_COMMIT=${{ github.sha }}
            RUEDER_BRANCH=${{ github.head_ref || github.ref_name }}
            RUEDER_DIRTY=false
            RUEDER_CI_RUN=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          cache-from: type=gha,scope=image-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.platform }}
      # With RUEDER_IMAGE the test starts the image built above instead of
      # building one of its own; with RUEDER_COMMIT it also asks the image
      # which commit it says it is of. What it should say comes from git, not
      # from the same expression as the build argument, so the two can differ.
      - run: RUEDER_COMMIT="$(git rev-parse HEAD)" deploy/smoke-test.sh
        env:
          RUEDER_IMAGE: rueder:ci
      # The archive holds one image, the one the smoke test started: its
      # configuration has the digest Docker knows that image by.
      - name: Check the archive
        env:
          ARCHIVE: ${{ runner.temp }}/rueder-${{ matrix.platform }}.tar
        run: |
          tar -xOf "$ARCHIVE" index.json | jq -e '.manifests | length == 1' > /dev/null
          manifest=$(tar -xOf "$ARCHIVE" index.json | jq -r '.manifests[0].digest')
          config=$(tar -xOf "$ARCHIVE" "blobs/sha256/${manifest#sha256:}" | jq -r '.config.digest')
          tested=$(docker image inspect rueder:ci --format '{{.Id}}')
          echo "archive: $config, tested: $tested"
          [ "$config" = "$tested" ]
      # What publish does with the archive, tried against a registry on this
      # runner, so that a change to it shows up before it reaches main. Only
      # the amd64 runner has skopeo; publish runs there too.
      - name: Rehearse publishing
        if: matrix.platform == 'amd64'
        env:
          ARCHIVE: ${{ runner.temp }}/rueder-${{ matrix.platform }}.tar
        run: |
          docker run --detach --name registry --publish 127.0.0.1:5000:5000 registry:3
          for _ in $(seq 30); do curl -fs http://127.0.0.1:5000/v2/ > /dev/null && break; sleep 1; done
          digest=$(tar -xOf "$ARCHIVE" index.json | jq -r '.manifests[0].digest')
          skopeo copy --preserve-digests --dest-tls-verify=false "oci-archive:$ARCHIVE" "docker://127.0.0.1:5000/rueder@$digest"
          skopeo inspect --tls-verify=false --raw "docker://127.0.0.1:5000/rueder@$digest" | sha256sum | grep -q "^${digest#sha256:} "
      # Only a push to main publishes, and only what got this far.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-${{ matrix.platform }}
          path: ${{ runner.temp }}/rueder-${{ matrix.platform }}.tar
          if-no-files-found: error
          retention-days: 1
          # The layers are compressed already.
          compression-level: 0

  # Every push to main that passed the jobs above becomes
  # ghcr.io/fionapreroll/rueder:latest and :sha-<commit>, for both
  # architectures: the two archives the job image tested are pushed as they
  # are, by their digests, then tied together under the tags by an index that
  # says which of them fits the machine that pulls it.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [server, dependencies, web, e2e, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # For the attestation below: a signing certificate from Sigstore for
      # this run, and the right to store the attestation with the image.
      id-token: write
      attestations: write
      artifact-metadata: write
    # One publish at a time, so that the check below sees what main is when
    # the push happens.
    concurrency:
      group: publish-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # :latest only for the commit main points at now. When two merges land
      # close together, the checks of the older one can finish last; it still
      # gets its :sha-<commit> tag but leaves :latest to the newer one.
      - id: head
        run: |
          head=$(git ls-remote origin refs/heads/main | cut -f1)
          echo "latest=$([ "$head" = "$GITHUB_SHA" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: ${{ runner.temp }}/images
          pattern: image-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      # skopeo below reads the login from Docker's settings too.
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Each archive holds one image. skopeo (on the runner) pushes it without
      # changing a byte, to the address of its digest, and refuses if what it
      # pushes would not have that digest.
      - name: Push
        working-directory: ${{ runner.temp }}/images
        run: |
          for platform in amd64 arm64; do
            archive="rueder-$platform.tar"
            tar -xOf "$archive" index.json | jq -e '.manifests | length == 1' > /dev/null
            digest=$(tar -xOf "$archive" index.json | jq -r '.manifests[0].digest')
            skopeo copy --preserve-digests "oci-archive:$archive" "docker://ghcr.io/fionapreroll/rueder@$digest"
            echo "ghcr.io/fionapreroll/rueder@$digest" >> sources
          done
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/fionapreroll/rueder
          tags: |
            type=raw,value=latest,enable=${{ steps.head.outputs.latest }}
            type=sha
      - id: index
        working-directory: ${{ runner.temp }}/images
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(cat sources)
          digest=$(docker buildx imagetools inspect "ghcr.io/fionapreroll/rueder:$VERSION" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      # A signed statement that this image, by its digest, was built by this
      # workflow from this commit. Before pulling, an installation can check it:
      #   gh attestation verify oci://ghcr.io/fionapreroll/rueder:latest --repo FionaPreroll/rueder
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/fionapreroll/rueder
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true

  # Every Monday (see schedule above): the published image against the known
  # vulnerabilities of what it holds besides rueder (glibc, libgcc, the
  # certificates of distroless). Only what has a fix fails the run: then
  # Dependabot's update of the base image, or any push to main, brings it.
  image-scan:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      # Version and checksum from the action's list, as in the job server.
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: trivy
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          failed=0
          for platform in linux/amd64 linux/arm64; do
            trivy image --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL \
              --exit-code 1 --platform "$platform" ghcr.io/fionapreroll/rueder:latest || failed=1
          done
          exit "$failed"
