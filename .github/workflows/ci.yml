name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Mondays at 05:17 UTC: a new advisory about a dependency shows up even
  # in a week without a change. Only the job `dependencies` runs then.
  schedule:
    - cron: "17 5 * * 1"

jobs:
  # The new server in server/ and the new frontend in web/. The old Go backend
  # and the old frontend are no longer built or checked.
  server:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Builds use the committed .sqlx cache; tests need a server to create per-test databases.
      SQLX_OFFLINE: "true"
      DATABASE_URL: postgres://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # Runs the tests (like cargo test) with coverage instrumentation, for Codecov.
      - run: cargo llvm-cov --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: server/lcov.info
          flags: server

  # What the server is built from: no dependency with a known vulnerability,
  # only licenses, sources and crates that server/deny.toml allows.
  dependencies:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      # Reads Cargo.lock; its exceptions are in server/.cargo/audit.toml.
      - run: cargo audit
      # Reads what is really built: advisories again, licenses, banned crates, sources.
      - run: cargo deny check

  web:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The pnpm version pinned in package.json (packageManager).
      - run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run check
      # Unit and component tests with coverage, for Codecov.
      - run: pnpm run test:coverage
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: web/coverage/lcov.info
          flags: web
      - run: pnpm run build
      # The interface as one HTML file that runs without a server, to try a change
      # by opening the file: download it from the run's artifacts.
      - run: pnpm run build:single
      - uses: actions/upload-artifact@v4
        with:
          name: rueder-ui-draft
          path: web/build/index.html
          if-no-files-found: error

  # The built page in a real browser against the real server: logging in,
  # subscribing, reading, folders, filter rules and live updates (web/e2e).
  e2e:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SQLX_OFFLINE: "true"
      # Where the run makes its own database, rueder_e2e.
      DATABASE_URL: postgres://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo build
        working-directory: server
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global "$(node -p 'require("./package.json").packageManager')"
        working-directory: web
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm run build
        working-directory: web
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      - run: pnpm run e2e
        working-directory: web
      # What the browser saw when a test failed: screenshots and traces.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report
          path: |
            web/playwright-report
            web/test-results

  # The Android app (app/): the start page's tests, then both builds. "github"
  # is the one released below, which looks for new versions of itself if the
  # reader agrees; "play" is for the Play Store, without the update check. With
  # the signing key in the repository's secrets, the github build is a signed
  # release; without it (as in pull requests from forks) a debug build, which
  # installs but cannot update an installed release.
  app:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # It only reads the repository; releasing is the job app-release's.
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm test
      # The start page into the Android project.
      - run: pnpm run sync
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      # The key from the secrets, into a file only this run sees.
      - name: Signing key
        id: key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/rueder.keystore"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        working-directory: app/android
        env:
          VERSION_CODE: ${{ github.run_number }}
          RUEDER_KEYSTORE: ${{ steps.key.outputs.signed == 'true' && format('{0}/rueder.keystore', runner.temp) || '' }}
          RUEDER_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RUEDER_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RUEDER_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # The version, the build and the commit, as Android shows the app's version.
        run: |
          export VERSION_NAME="$(node -p "require('../package.json').version")-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          if [ "${{ steps.key.outputs.signed }}" = true ]; then github=assembleGithubRelease; else github=assembleGithubDebug; fi
          ./gradlew --no-daemon testGithubDebugUnitTest testPlayDebugUnitTest "$github" assemblePlayRelease
          mkdir -p ../out
          if [ "${{ steps.key.outputs.signed }}" = true ]; then
            mv app/build/outputs/apk/github/release/app-github-release.apk ../out/rueder.apk
          else
            mv app/build/outputs/apk/github/debug/app-github-debug.apk ../out/rueder-debug.apk
          fi
          mv app/build/outputs/apk/play/release/app-play-release-unsigned.apk ../out/rueder-play-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: rueder-android
          path: app/out/
          if-no-files-found: error

  # Every push to main that passed the checks and was signed replaces the
  # release "rueder for Android" (tag android-latest): the APK and its
  # version.json, which the app reads to find a newer build.
  app-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web, e2e, app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: android-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rueder-android
          path: out
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: android-latest
        run: |
          if [ ! -f out/rueder.apk ]; then
            echo "No signed APK (no key in the secrets): nothing to release."
            exit 0
          fi
          # Only for the commit main points at now, so an older run that ends
          # last does not replace a newer build.
          head=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$head" != "$GITHUB_SHA" ]; then echo "main moved on"; exit 0; fi
          printf '{"build":%s,"commit":"%s","size":%s}\n' "$GITHUB_RUN_NUMBER" "$GITHUB_SHA" "$(stat -c %s out/rueder.apk)" > out/version.json
          cat > notes.md <<NOTES
          The newest build of rueder for Android, from commit ${GITHUB_SHA::7} (build ${GITHUB_RUN_NUMBER}). This release is replaced with every change to \`main\`.

          **Installing:** download \`rueder.apk\` below and open it on the phone; Android asks once to allow installing apps from that source. At the first start the app asks for the address of your rueder. A newer APK installs over an older one, and the app can look for one itself if you agree (on its start page, or with a long press on its icon: Server and updates).
          NOTES
          git push -f origin "HEAD:refs/tags/$TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/rueder.apk out/version.json --clobber
            gh release edit "$TAG" --title "rueder for Android" --notes-file notes.md --latest=false
          else
            gh release create "$TAG" out/rueder.apk out/version.json --title "rueder for Android" --notes-file notes.md --latest=false
          fi

  # The container image as deploy/compose.yaml runs it: built, started next to
  # PostgreSQL and asked whether it works. Published only by the job below.
  image:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # The layers go to the cache of GitHub Actions, so that an unchanged
      # stage is not built again and the job publish finds this build there.
      - uses: docker/build-push-action@v6
        with:
          context: .
          tags: rueder:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # With RUEDER_IMAGE the test starts the image built above instead of
      # building one of its own.
      - run: deploy/smoke-test.sh
        env:
          RUEDER_IMAGE: rueder:ci

  # Every push to main that passed the jobs above becomes
  # ghcr.io/fionapreroll/rueder:latest and :sha-<commit>.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [server, dependencies, web, e2e, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # One publish at a time, so that the check below sees what main is when
    # the push happens.
    concurrency:
      group: publish-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      # :latest only for the commit main points at now. When two merges land
      # close together, the checks of the older one can finish last; it still
      # gets its :sha-<commit> tag but leaves :latest to the newer one.
      - id: head
        run: |
          head=$(git ls-remote origin refs/heads/main | cut -f1)
          echo "latest=$([ "$head" = "$GITHUB_SHA" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/fionapreroll/rueder
          tags: |
            type=raw,value=latest,enable=${{ steps.head.outputs.latest }}
            type=sha
      # Same Dockerfile and commit as the job image, so the layers come from
      # its cache and what is published is what the smoke test started. For
      # amd64 only: building the server for arm64 under emulation would take
      # far longer than all other jobs together.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
