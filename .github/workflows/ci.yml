name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Mondays at 05:17 UTC: a new advisory about a dependency shows up even
  # in a week without a change. Only the job `dependencies` runs then.
  schedule:
    - cron: "17 5 * * 1"

jobs:
  # The new server in server/ and the new frontend in web/. The old Go backend
  # and the old frontend are no longer built or checked.
  server:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Builds use the committed .sqlx cache; tests need a server to create per-test databases.
      SQLX_OFFLINE: "true"
      DATABASE_URL: postgres://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # Runs the tests (like cargo test) with coverage instrumentation, for Codecov.
      - run: cargo llvm-cov --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: server/lcov.info
          flags: server

  # What the server is built from: no dependency with a known vulnerability,
  # only licenses, sources and crates that server/deny.toml allows.
  dependencies:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      # Reads Cargo.lock; its exceptions are in server/.cargo/audit.toml.
      - run: cargo audit
      # Reads what is really built: advisories again, licenses, banned crates, sources.
      - run: cargo deny check

  web:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The pnpm version pinned in package.json (packageManager).
      - run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run check
      # Unit and component tests with coverage, for Codecov.
      - run: pnpm run test:coverage
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: web/coverage/lcov.info
          flags: web
      - run: pnpm run build
      # The interface as one HTML file that runs without a server, to try a change
      # by opening the file: download it from the run's artifacts.
      - run: pnpm run build:single
      - uses: actions/upload-artifact@v4
        with:
          name: rueder-ui-draft
          path: web/build/index.html
          if-no-files-found: error

  # The built page in a real browser against the real server: logging in,
  # subscribing, reading, folders, filter rules and live updates (web/e2e).
  e2e:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SQLX_OFFLINE: "true"
      # Where the run makes its own database, rueder_e2e.
      DATABASE_URL: postgres://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo build
        working-directory: server
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global "$(node -p 'require("./package.json").packageManager')"
        working-directory: web
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm run build
        working-directory: web
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      - run: pnpm run e2e
        working-directory: web
      # What the browser saw when a test failed: screenshots and traces.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report
          path: |
            web/playwright-report
            web/test-results

  # The container image as deploy/compose.yaml runs it: built, started next to
  # PostgreSQL and asked whether it works. Published only by the job below.
  image:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # The layers go to the cache of GitHub Actions, so that an unchanged
      # stage is not built again and the job publish finds this build there.
      - uses: docker/build-push-action@v6
        with:
          context: .
          tags: rueder:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # With RUEDER_IMAGE the test starts the image built above instead of
      # building one of its own.
      - run: deploy/smoke-test.sh
        env:
          RUEDER_IMAGE: rueder:ci

  # Every push to main that passed the jobs above becomes
  # ghcr.io/fionapreroll/rueder:latest and :sha-<commit>.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [server, dependencies, web, e2e, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # One publish at a time, so that the check below sees what main is when
    # the push happens.
    concurrency:
      group: publish-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      # :latest only for the commit main points at now. When two merges land
      # close together, the checks of the older one can finish last; it still
      # gets its :sha-<commit> tag but leaves :latest to the newer one.
      - id: head
        run: |
          head=$(git ls-remote origin refs/heads/main | cut -f1)
          echo "latest=$([ "$head" = "$GITHUB_SHA" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/fionapreroll/rueder
          tags: |
            type=raw,value=latest,enable=${{ steps.head.outputs.latest }}
            type=sha
      # Same Dockerfile and commit as the job image, so the layers come from
      # its cache and what is published is what the smoke test started. For
      # amd64 only: building the server for arm64 under emulation would take
      # far longer than all other jobs together.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
