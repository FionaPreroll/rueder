name: gitleaks
on:
  pull_request:
  push:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *" # run once a day at 5 AM

jobs:
  scan:
    name: gitleaks
    runs-on: ubuntu-latest
    # It reads the commits, of a pull request too, and changes nothing.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
