# Updates for what the new rueder is built from, once a month and one pull
# request per ecosystem. Security updates come on their own whenever an
# advisory appears. The old backend/ and frontend/ have no package files any
# more, so nothing there is updated or reported.
version: 2
updates:
  - package-ecosystem: cargo
    directories: ["/server", "/server/fuzz"]
    schedule:
      interval: monthly
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: npm
    directories: ["/web", "/app"]
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]
  # The Android project of the app. Capacitor's own parts come with npm above.
  - package-ecosystem: gradle
    directory: /app/android
    schedule:
      interval: monthly
    groups:
      gradle:
        patterns: ["*"]
  # The base images in the Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
