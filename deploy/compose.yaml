# rueder, its database and RSSifier, which makes feeds of websites without
# one. How to install: README.md in this directory.
#
#   cp .env.example .env    # and set POSTGRES_PASSWORD
#   docker compose up --detach --build

name: rueder

services:
  rueder:
    # Built from this repository, or the image CI publishes when .env names
    # it (RUEDER_IMAGE=ghcr.io/fionapreroll/rueder:latest).
    image: ${RUEDER_IMAGE:-rueder}
    build:
      context: ..
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Every setting of the server can go into .env (see .env.example).
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://rueder:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@db:5432/rueder
      # RSSifier next door, once .env names the token both share.
      RSSIFIER_URL: ${RSSIFIER_TOKEN:+http://rssifier:3100/}
      RSSIFIER_TOKEN: ${RSSIFIER_TOKEN:-}
    # Only this machine reaches rueder: a reverse proxy in front of it does
    # TLS, without which nobody can log in.
    ports:
      - "${RUEDER_LISTEN:-127.0.0.1:3000}:3000"
    volumes:
      # The cache of the image proxy and its key. Nothing in it needs a backup.
      - images:/var/cache/rueder
    # The image runs as a user that is not root. It gets a file system it
    # cannot write to, except for the volume above, and no privileges.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Websites without a feed come through RSSifier (rssifier/README.md). Only
  # rueder reaches it, over the network of this file; it answers nobody
  # without the token. Without RSSIFIER_TOKEN in .env it runs but nobody asks
  # it.
  rssifier:
    image: ${RSSIFIER_IMAGE:-rssifier}
    build:
      context: ..
      dockerfile: rssifier/Dockerfile
    restart: unless-stopped
    # Only these settings, not all of .env: RSSifier needs none of rueder's.
    environment:
      RSSIFIER_TOKEN: ${RSSIFIER_TOKEN:-}
      RSSIFIER_BLOCKED_HOSTS: ${RSSIFIER_BLOCKED_HOSTS:-}
      RSSIFIER_ENABLE: ${RSSIFIER_ENABLE:-}
    volumes:
      # The tokens `rssifier token add` makes, for other readers than this
      # rueder.
      - rssifier:/etc/rssifier
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: rueder
      POSTGRES_DB: rueder
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    # More memory for PostgreSQL's cache makes large installations faster; a
    # quarter of the machine's memory is a common choice.
    command: ["postgres", "-c", "shared_buffers=${POSTGRES_SHARED_BUFFERS:-128MB}"]
    shm_size: 256mb
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "--username=rueder", "--dbname=rueder"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s

volumes:
  # Everything rueder knows. This is what to back up.
  db:
  images:
  rssifier:
