[package]
name = "hardened-http"
version = "0.1.0"
edition = "2024"
description = "An HTTP client that fetches addresses others name without reaching into its own network (SSRF)"
repository = "https://github.com/FionaPreroll/rueder"
# rueder and RSSifier take it by its path; it goes to crates.io when RSSifier
# moves to a repository of its own.
publish = false

[dependencies]
anyhow = "1.0.104"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "gzip", "brotli", "deflate", "zstd"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1.53.2", features = ["net", "time"] }
url = "2.5.8"
webpki-roots = "1.0.11"

[dev-dependencies]
axum = "0.8.9"
flate2 = "1.1.11"
proptest = "1.12.0"
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }

[lints.rust]
unsafe_code = "forbid"
